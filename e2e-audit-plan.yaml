version: 1
plan:
  name: DailyStack E2E Production Audit
  max_concurrency: 6
  max_consecutive_failures: 2
  max_cycles: 5
  auto_reject_retries: 1
tasks:
  - id: audit-dashboard
    title: Audit Dashboard Page
    prompt: |
      You are auditing the DailyStack fintech app DashboardPage.tsx.
      Location: D:\Coding Folder\dailystack-fintech\app\src\components\DashboardPage.tsx

      AUDIT CHECKLIST:
      1. Every button onClick — verify calls real handler or navigation
      2. Every navigation — verify onNavigate() wired to actual page
      3. Data source — check real state/props vs hardcoded mock
      4. Error handling — check loading/empty states
      5. API calls — verify Supabase connection or mock
      6. Edge cases — null checks, empty arrays

      AUDIT EACH SECTION:
      - Hero Card: graph data, trend calculation
      - Recent Activity: transaction data source
      - Accounts: balance data source
      - Upcoming Bills: subscription data source

      OUTPUT FORMAT:
      For each issue found:
      - Line number, Code snippet, Problem, Severity, Fix

      End with: Production Ready Score: X/10
    assigned_to: explore
    verify_skip_reason: Owner will compile all results into final report; exploration provides bounded deliverable
    max_retries: 1

