name: Nightly QA Tests

on:
  schedule:
    # Run at midnight UTC daily
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      test_environment:
        description: 'Test environment (preview/production)'
        required: false
        default: 'preview'

env:
  NODE_VERSION: '20'

jobs:
  setup:
    name: Setup Test Environment
    runs-on: ubuntu-latest
    outputs:
      test-url: ${{ steps.deploy.outputs.preview-url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: |
          cd app
          npm ci

      - name: Deploy Preview for Testing
        id: deploy
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod=false'
          working-directory: app

      - name: Set test URL
        id: outputs
        run: |
          echo "preview-url=${{ steps.deploy.outputs.preview-url }}" >> $GITHUB_OUTPUT

  e2e-tests:
    name: E2E Tests
    needs: setup
    runs-on: ubuntu-latest
    environment:
      name: preview
      url: ${{ needs.setup.outputs.test-url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: |
          cd app
          npm ci

      - name: Install Playwright browsers
        run: |
          cd app
          npx playwright install --with-deps chromium

      - name: Run E2E tests
        env:
          TEST_BASE_URL: ${{ needs.setup.outputs.test-url }}
        run: |
          cd app
          npx playwright test --config ../playwright.config.ts --project=chromium

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: reports/
          retention-days: 14

      - name: Upload test screenshots
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-screenshots
          path: test-results/
          retention-days: 14

  report:
    name: QA Report
    needs: [setup, e2e-tests]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download test results
        uses: actions/download-artifact@v4
        with:
          name: playwright-report
          path: reports/

      - name: Generate QA Report
        run: |
          echo "## Nightly QA Report - ${{ github.event.repository.name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Test Environment" >> $GITHUB_STEP_SUMMARY
          echo "- **URL**: ${{ needs.setup.outputs.test-url }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Timestamp**: $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Test Results" >> $GITHUB_STEP_SUMMARY
          echo "- **E2E Tests**: ${{ needs.e2e-tests.result == 'success' && '✅ Passed' || '❌ Failed' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Actions" >> $GITHUB_STEP_SUMMARY
          echo "- [View Playwright Report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY

      - name: Notify on failure
        if: needs.e2e-tests.result == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '[QA] Nightly E2E Tests Failed',
              body: `## Nightly E2E Test Failure 🚨\n\nThe nightly E2E tests have failed.\n\n**Preview URL**: ${{ needs.setup.outputs.test-url }}\n**Run ID**: ${{ github.run_id }}\n\nPlease investigate and fix the issues.`,
              labels: ['bug', 'automated']
            });
