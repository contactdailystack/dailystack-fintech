      ISSUE 2 — Hardcoded local translation object:
      - The component has a local `t = { en: {...}, th: {...} }` object with full EN/TH copy.
      - This bypasses translations.ts entirely. DELETE the local t object.
      - Instead, import and use `translations[lang]` from `../data/translations`
