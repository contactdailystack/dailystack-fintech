  - id: "ux-trust-security"
    title: "Add Trust & Security UI Components"
    prompt: |
      You are the FinTech UX specialist for DailyStack.

      MISSION: Implement Trust & Security UI to boost user confidence in this financial app.

      READ FIRST:
      1. Read `app/src/design-system/index.ts` — understand what components exist
      2. Read `app/src/components/FloatingBottomNav.tsx` — understand the nav pattern
      3. Read `app/src/data/translations.ts` — existing translation keys

      IMPLEMENT the following components:

      1. `app/src/components/SecurityBadge.tsx` — Reusable security indicator badge
         - Props: variant ('encrypted' | 'verified' | 'secure')
         - Display: Lock icon + text (256-bit Encrypted / Verified Account / Secure Connection)
         - Use Apple system green #34C759 for success states
         - Appears in Settings/Profile, Auth screens, Dashboard header

      2. `app/src/components/BiometricButton.tsx` — Face ID / Fingerprint auth button
         - Props: onAuthenticate, isLoading
         - Shows Face ID icon or Fingerprint icon based on platform
         - Used in AuthPage and Settings for quick re-auth

      3. `app/src/components/ConfirmationModal.tsx` — Financial transaction confirmation
         - Props: title, amount, merchant, date, onConfirm, onCancel, warningText
         - Clearly shows what user is about to do
         - Warning text: "This action cannot be undone"
         - Large Confirm/Cancel buttons (min 44px touch target)
         - Haptic feedback on confirm

      4. `app/src/components/ErrorState.tsx` — Clear error states with recovery actions
         - Props: error, onRetry, onDismiss
         - Shows specific error message (NOT generic "Something went wrong")
         - Provides actionable next steps (retry button, contact support link)
         - Uses #FF3B30 sparingly — only for critical errors

      5. `app/src/components/EmptyState.tsx` — Consistent empty state with CTAs
         - Props: icon, title, description, action (optional)
         - Follows Apple's empty state guidelines
         - Call-to-action button to resolve the empty state

      WRITE:
      - `app/src/components/SecurityBadge.tsx`
      - `app/src/components/BiometricButton.tsx`
      - `app/src/components/ConfirmationModal.tsx`
      - `app/src/components/ErrorState.tsx`
      - `app/src/components/EmptyState.tsx`
      - Update `app/src/components/index.ts` to export new components

      Verify: `cd D:\Coding Folder\dailystack-fintech\app && npx tsc --noEmit`
      Report: files created, TypeScript result.
    assigned_to: "general"
    role: "produce"
    depends_on: ["foundation-tokens"]
    verify_skip_reason: "New components verified by TypeScript."
    max_retries: 1

