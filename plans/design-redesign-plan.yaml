version: 1
plan:
  name: "DailyStack iOS HIG Redesign"
  max_concurrency: 3
  max_consecutive_failures: 2
  max_cycles: 10
  auto_reject_retries: 1
  verifier_config:
    default_verifiers: [verifier]
    audit_sample_rate: 0.0

tasks:
  - id: "foundation-tokens"
    title: "Consolidate Design Tokens — Lime + Pilo Light"
    prompt: |
      You are the iOS HIG design system architect for DailyStack.

      DESIGN DECISIONS (locked — do not change):
      - Colors: Lime E-Pay style (#CDFF24 / #D4FF3A)
      - Theme: Pilo Light Mode (white/light backgrounds)
      - Typography: Inter (EN) + Kanit (TH)
      - Design language: Apple HIG (Clarity, Deference, Depth)
      - Tab bar: App Store style (5 tabs: Home, Recurring, Net Worth, Transaction, Profile)

      MISSION: Rewrite `app/src/design-system/color-tokens.ts` to be THE single source of truth for the Pilo Light theme.

      YOUR SPEC:
      1. Read the current `app/src/design-system/color-tokens.ts`
      2. Read `app/src/design-system/spacing-tokens.ts` (keep as-is, it's good)
      3. Read `app/src/design-system/typography.ts` (keep as-is, Inter+Kanit is correct)
      4. Read `app/src/design-system/PRINCIPLES.md`
      5. Rewrite color-tokens.ts with these Apple HIG + Pilo Light values:
         - Background: #FFFFFF (white), #F5F5F7 (Apple system gray 6 bg)
         - Surface: #FFFFFF (cards), #F0F0F0 (secondary surfaces)
         - Primary/Accent: Lime #CDFF24, light #D4FF3A, muted rgba(205,255,36,0.15)
         - Text primary: #1D1D1F (Apple dark text)
         - Text secondary: #86868B (Apple secondary label)
         - Text tertiary: #AEAEB2 (Apple tertiary label)
         - Success: #34C759 (Apple system green)
         - Warning: #FF9F0A (Apple system orange) — NEVER use red
         - Error: #FF3B30 (Apple system red) — sparingly only
         - Insight/AI: #AF52DE (Apple system purple)
         - Border: #D2D2D7 (Apple separator)
         - Shadow: rgba(0,0,0,0.08) soft shadow for cards
      6. Also create `app/src/design-system/css-variables.css` with CSS custom properties
      7. Update `app/src/design-system/index.ts` to export the new tokens cleanly

      WRITE these files:
      - `app/src/design-system/color-tokens.ts` — complete rewrite
      - `app/src/design-system/css-variables.css` — new file with CSS custom properties
      - `app/src/design-system/index.ts` — updated exports

      Verify by running: `cd D:\Coding Folder\dailystack-fintech\app && npx tsc --noEmit`
      Report: list of files changed and TypeScript result.
    assigned_to: "general"
    role: "produce"
    verify_skip_reason: "Design token changes are structural — TypeScript compilation serves as the verification gate."
    max_retries: 1

  - id: "foundation-nav"
    title: "Refactor FloatingBottomNav — App Store Tab Bar"
    prompt: |
      You are the iOS navigation specialist for DailyStack.

      DESIGN DECISIONS (locked):
      - 5 tabs: Home, Recurring, Net Worth, Transaction, Profile
      - App Store Tab Bar style (pill capsule + floating circle)
      - Use translations.ts for EN/TH labels (no hardcoded labelEn/labelTh)
      - Lime accent color (#CDFF24) for active state
      - Light theme (white background)
      - Route paths: /dashboard, /subscriptions, /networth, /activity, /settings

      MISSION: Rewrite `app/src/components/FloatingBottomNav.tsx`

      YOUR SPEC:
      1. Read `app/src/components/FloatingBottomNav.tsx` (current)
      2. Read `app/src/data/translations.ts` — extract the nav label keys (dashboardTab, radarTabMenu, etc.)
      3. Rewrite FloatingBottomNav.tsx with:
         - NO hardcoded labelEn/labelTh — use translations[lang].dashboardTab etc.
         - Active state: Lime (#CDFF24) text/icon color
         - Inactive state: #86868B (Apple gray)
         - White/blur capsule background (rgba(255,255,255,0.95) + backdrop blur)
         - 56px capsule height, 56px circle button
         - Framer-motion layout animation for active tab (layoutId="activeTab")
         - Haptic feedback on tap (haptics.fire('SELECT'))
         - 5 tabs ONLY in MAIN_CAPSULE_TABS array
         - Fix the 'Recurring' Thai label: should be เงาการสมัคร or similar from translations

      WRITE: `app/src/components/FloatingBottomNav.tsx`

      Verify: `cd D:\Coding Folder\dailystack-fintech\app && npx tsc --noEmit`
      Report: list of changes and TypeScript result.
    assigned_to: "general"
    role: "produce"
    depends_on: ["foundation-tokens"]
    verify_skip_reason: "Navigation changes verified by TypeScript + downstream page tasks."
    max_retries: 1

  - id: "foundation-cleanup"
    title: "Delete Dead Pages and Unused Components"
    prompt: |
      You are the cleanup specialist for DailyStack.

      MISSION: Delete files that are dead code — not imported by any route or component.

      FIND and DELETE these confirmed dead pages (no routes reference them):
      1. `app/src/components/PiloPillCardShowcase.tsx`
      2. `app/src/components/SidebarTools.tsx`
      3. `app/src/components/ZeroButtonDashboard.tsx`
      4. `app/src/components/LiquidParticleEngine.tsx`
      5. `app/src/components/DatabasePage.tsx` (redirected to /dashboard, never shown)
      6. `app/src/components/MorePage.tsx` (redirected, never shown)

      ALSO check if `app/src/components/BottomNavBar.tsx` is used — if NOT imported anywhere, delete it too.

      VERIFY before deleting: grep the codebase for each filename. Only delete if zero imports found.

      ALSO update `app/src/App.tsx` to remove any references to deleted pages (if any remain).

      USE mavis-trash for safe deletion (recoverable via OS Trash).

      WRITE: None (deletions only)
      Report: list of deleted files and any App.tsx updates.
    assigned_to: "general"
    role: "produce"
    verify_skip_reason: "Dead code deletion is low-risk; TypeScript compilation catches broken imports."
    max_retries: 1

  - id: "core-dashboard"
    title: "Refactor DashboardPage — Real Data + Design Tokens"
    prompt: |
      You are a senior iOS developer refactoring DailyStack's DashboardPage.

      DESIGN SYSTEM (use tokens, NOT hardcoded Tailwind values):
      - Background: #FFFFFF (white)
      - Surface/Card: #F0F0F0
      - Accent: #CDFF24 (lime)
      - Text primary: #1D1D1F, Text secondary: #86868B
      - Success: #34C759, Warning: #FF9F0A
      - Border: #D2D2D7
      - Font: Inter (EN), Kanit (TH) via CSS variables
      - Touch target: min 44x44pt
      - Spacing: 8pt grid (8, 16, 24, 32px)
      - Border radius: 12px (cards), 8px (buttons), 20px (hero cards)

      MISSION: Refactor `app/src/components/DashboardPage.tsx`

      YOUR SPEC:
      1. Read `app/src/components/DashboardPage.tsx` FULLY
      2. Read `app/src/data/translations.ts`
      3. Read `app/src/services/transactionService.ts`
      4. Read `app/src/services/subscriptionService.ts`
      5. Refactor DashboardPage:
         a. REMOVE all hardcoded Tailwind color values (#EF4444, #6366F1, #F7F8FA, etc.)
         b. USE CSS variables or design token references instead
         c. Replace mock data with real service calls (transactionService, subscriptionService)
         d. Clean up to under 500 lines by extracting sections into sub-components within the same file
         e. Use translations[lang] for ALL user-facing strings
         f. Fix BOM character at line 1 (remove U+FEFF)
         g. Extract sub-components: HeroBalanceCard, SubscriptionWidget, RecentTransactionsList, QuickActionsBar

      WRITE: `app/src/components/DashboardPage.tsx` (refactored)
      Verify: `cd D:\Coding Folder\dailystack-fintech\app && npx tsc --noEmit`
      Report: changed files, line count before/after, TypeScript result.
    assigned_to: "general"
    role: "produce"
    depends_on: ["foundation-tokens", "foundation-nav"]
    verify_skip_reason: "Page refactoring verified by TypeScript + final E2E phase."
    max_retries: 2

  - id: "core-subscriptions"
