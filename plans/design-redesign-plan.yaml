  - id: "ux-accessibility"
    title: "WCAG 2.1 Accessibility Improvements"
    prompt: |
      You are the accessibility specialist for DailyStack.

      MISSION: Fix WCAG 2.1 compliance issues across all components.

      READ FIRST:
      1. Read `app/src/design-system/color-tokens.ts` (updated version)
      2. Read `app/src/components/DashboardPage.tsx`
      3. Read `app/src/components/FloatingBottomNav.tsx`

      FIX the following accessibility issues:

      1. COLOR CONTRAST — Ensure all text meets 4.5:1 ratio (WCAG 1.4.3)
         - Check that white text on dark backgrounds passes contrast ratio
         - If text is too light, add text-shadow or darken the color
         - Check in DashboardPage and other dark-theme components

      2. REDUCED MOTION SUPPORT — Respect prefers-reduced-motion (WCAG 2.3.1)
         - Read current motion/animation implementation
         - Add reduced motion check: `window.matchMedia('(prefers-reduced-motion: reduce)')`
         - Provide non-animated fallbacks for sensitive users

      3. SCREEN READER LABELS — ARIA improvements (WCAG 1.3.1)
         - Add aria-label to all icon-only buttons
         - Add aria-describedby for complex interactive elements
         - Add aria-live="polite" for dynamic content updates
         - Add role="status" for balance/summary sections

      4. FOCUS VISIBILITY — Visible focus indicators (WCAG 2.4.7)
         - Ensure keyboard navigation has visible focus rings
         - Style: 2px solid lime accent, 2px offset

      5. TOUCH TARGET VERIFICATION
         - Verify all interactive elements are min 44x44px
         - Check DashboardPage, BottomNav, all form inputs
         - Fix any targets smaller than 44px

      WRITE:
      - Update components with accessibility fixes
      - Document any CSS changes in a comment block

      Verify: `cd D:\Coding Folder\dailystack-fintech\app && npx tsc --noEmit`
      Report: files modified, accessibility issues fixed.
    assigned_to: "general"
    role: "produce"
    depends_on: ["foundation-tokens", "foundation-nav"]
    verify_skip_reason: "Accessibility fixes are qualitative; TypeScript ensures no breaking changes."
    max_retries: 1

