      // Bottom Tab Helper — Rocket Money Style
      const renderBottomTab = ({
        id,
        label,
        icon: Icon,
        isActive,
        onPress,
      }: {
        id: string;
        label: string;
        icon: React.ElementType;
        isActive: boolean;
        onPress: () => void;
