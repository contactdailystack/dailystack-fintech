  - id: "hero-widget"
    title: "[Section 2] Hero Widget — Spending Carousel + Area Chart"
    prompt: |
      ## Mission
      Replace the existing Hero Card in DashboardPage.tsx with a Rocket Money-style Hero Widget featuring:
      1. Large black "$X,XXX" spend amount
      2. Green "below avg" badge top-right (positive reinforcement)
      3. Minimalist area/line chart with budget threshold line
      4. Payday banner at bottom
      5. Carousel indicators (3 dots)

      ## Design Rules
      - ProfilePage = Sole Design Source of Truth
      - Tokens: bg=#0B0F0A (dark card), surface=#F4F5F7, accent=#C7FF2E
      - Font: Kanit (TH) / Inter (EN)
      - Card radius: rounded-[32px], padding: px-8 py-6

      ## Implementation

      Find the EXISTING Hero Card in DashboardPage.tsx (search for "Spent this month" or the first dark card near the top) and REPLACE it entirely with:

      ```tsx
      {/* ============================================================ */}
      {/* HERO WIDGET — Spending Control Carousel                    */}
      {/* ============================================================ */}

      {/* Dark Hero Card */}
      <div
        className="w-full rounded-[32px] overflow-hidden"
        style={{ backgroundColor: '#0B0F0A', padding: 'px-7 py-6' }}
      >
        {/* Row 1: Amount (left) + Below Avg Badge (right) */}
        <div className="flex items-start justify-between w-full mb-4">
          {/* Left: Monthly Spend */}
          <div className="flex flex-col items-start gap-1">
            <span
              className="text-[11px] font-medium uppercase tracking-wider"
              style={{ color: '#6B7280', fontFamily: '"Inter", sans-serif' }}
            >
              {lang === 'th' ? 'ใช้จ่ายเดือนนี้' : 'SPENT THIS MONTH'}
            </span>
            <span
              className="text-[36px] font-bold leading-none"
              style={{ color: '#FFFFFF', fontFamily: '"Space Grotesk", sans-serif' }}
            >
              ฿{totalSpent.toLocaleString()}
            </span>
          </div>

          {/* Right: Below Avg Positive Badge */}
          {belowAverage > 0 && (
            <div className="flex items-center gap-1.5 mt-1">
              <div
                className="w-5 h-5 rounded-full flex items-center justify-center flex-shrink-0"
                style={{ backgroundColor: 'rgba(199, 255, 46, 0.15)' }}
              >
                <Check className="w-3 h-3" style={{ color: '#C7FF2E' }} />
              </div>
              <span
                className="text-[11px] font-medium"
                style={{ color: '#C7FF2E', fontFamily: '"Inter", sans-serif' }}
              >
                {lang === 'th'
                  ? `฿${belowAverage.toLocaleString()} ต่ำกว่าค่าเฉลี่ย`
                  : `$${belowAverage.toLocaleString()} below avg.`}
              </span>
            </div>
          )}
        </div>

        {/* Row 2: Minimalist Area Chart */}
        <div className="w-full h-24 mb-4 relative">
          <svg viewBox="0 0 320 80" className="w-full h-full" preserveAspectRatio="none">
            {/* Area fill — gradient from accent to transparent */}
            <defs>
              <linearGradient id="areaGradient" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stopColor="#3B82F6" stopOpacity="0.25" />
                <stop offset="100%" stopColor="#3B82F6" stopOpacity="0" />
              </linearGradient>
            </defs>

            {/* Generate mock daily spend data for the month */}
            {(() => {
              const daysInMonth = 30;
              const monthlyBudget = monthlyBudgets.length > 0 ? monthlyBudgets[0].amount : totalSpent * 1.3;
              const budgetLineY = 80 - (monthlyBudget / (totalSpent * 1.5)) * 80;

              // Generate smooth curve data
              const points: {x: number; y: number}[] = [];
              let cumulative = 0;
              const maxSpend = totalSpent * 1.5;

              for (let i = 0; i < daysInMonth; i++) {
                const dailySpend = i < daysInMonth - 1
                  ? Math.random() * (totalSpent / 15) * 0.7 + (totalSpent / 30)
                  : totalSpent - cumulative;
                cumulative += Math.min(dailySpend, maxSpend - cumulative);
                const x = (i / (daysInMonth - 1)) * 320;
                const y = Math.max(10, 80 - (cumulative / maxSpend) * 70);
                points.push({ x, y });
              }

              // Build SVG path
              const linePath = points.reduce((path, pt, i) => {
                if (i === 0) return `M ${pt.x},${pt.y}`;
                const prev = points[i - 1];
                const cpx = (prev.x + pt.x) / 2;
                return `${path} C ${cpx},${prev.y} ${cpx},${pt.y} ${pt.x},${pt.y}`;
              }, '');

              const areaPath = `${linePath} L 320,80 L 0,80 Z`;

              const lastPt = points[points.length - 1];

              return (
                <>
                  {/* Area fill */}
                  <path d={areaPath} fill="url(#areaGradient)" />
                  {/* Line */}
                  <path
                    d={linePath}
                    fill="none"
                    stroke="#3B82F6"
                    strokeWidth="2"
                    strokeLinecap="round"
                    strokeLinejoin="round"
                  />
                  {/* Current position dot */}
                  <circle cx={lastPt.x} cy={lastPt.y} r="4" fill="#3B82F6" />
                  <circle cx={lastPt.x} cy={lastPt.y} r="6" fill="#3B82F6" fillOpacity="0.3" />
                  {/* Budget threshold line */}
                  <line
                    x1="0"
                    y1={budgetLineY}
                    x2="320"
                    y2={budgetLineY}
                    stroke="#6B7280"
                    strokeWidth="1"
                    strokeDasharray="4 3"
                    strokeOpacity="0.6"
                  />
                  {/* Budget label */}
                  <text
                    x="4"
                    y={budgetLineY - 4}
                    fill="#6B7280"
                    fontSize="8"
                    fontFamily="Inter, sans-serif"
                  >
                    BUDGET
                  </text>
                </>
              );
            })()}
          </svg>
        </div>

        {/* Row 3: Payday Banner */}
        <div
          className="w-full flex items-center justify-between px-4 py-3 rounded-2xl mb-4"
          style={{ backgroundColor: 'rgba(255,255,255,0.06)' }}
        >
          <div className="flex items-center gap-2.5">
            <Banknote className="w-4 h-4" style={{ color: '#C7FF2E' }} />
            <span
              className="text-[13px] font-medium"
              style={{ color: '#D1D5DB', fontFamily: lang === 'th' ? '"Kanit", sans-serif' : '"Inter", sans-serif' }}
            >
              {lang === 'th' ? `วันเงินเดือนออก ${daysUntilPayday} วัน` : `Payday in ${daysUntilPayday} days`}
            </span>
          </div>
          <button
            className="w-6 h-6 rounded-full flex items-center justify-center cursor-pointer"
            aria-label="Info"
          >
            <Info className="w-3.5 h-3.5" style={{ color: '#6B7280' }} />
          </button>
        </div>

        {/* Row 4: 3-Column Stats */}
        <div className="grid grid-cols-3 gap-0 mb-4">
          {/* Spent */}
          <div className="flex flex-col items-center py-3" style={{ borderRight: '1px solid rgba(255,255,255,0.08)' }}>
            <span className="text-[10px] font-medium uppercase tracking-wider mb-1" style={{ color: '#6B7280', fontFamily: '"Inter", sans-serif' }}>
              {lang === 'th' ? 'ใช้ไป' : 'SPENT'}
            </span>
            <span className="text-[15px] font-bold" style={{ color: '#FFFFFF', fontFamily: '"Space Grotesk", sans-serif' }}>
              ฿{totalSpent.toLocaleString()}
            </span>
          </div>
          {/* Active */}
          <div className="flex flex-col items-center py-3" style={{ borderRight: '1px solid rgba(255,255,255,0.08)' }}>
            <span className="text-[10px] font-medium uppercase tracking-wider mb-1" style={{ color: '#6B7280', fontFamily: '"Inter", sans-serif' }}>
              {lang === 'th' ? 'ใช้งาน' : 'ACTIVE'}
            </span>
            <span className="text-[15px] font-bold" style={{ color: '#FFFFFF', fontFamily: '"Space Grotesk", sans-serif' }}>
              {activeSubscriptions.length}
            </span>
          </div>
          {/* Budget */}
          <div className="flex flex-col items-center py-3">
            <span className="text-[10px] font-medium uppercase tracking-wider mb-1" style={{ color: '#6B7280', fontFamily: '"Inter", sans-serif' }}>
              {lang === 'th' ? 'งบ' : 'BUDGET'}
            </span>
            <span className="text-[15px] font-bold" style={{ color: '#C7FF2E', fontFamily: '"Space Grotesk", sans-serif' }}>
              {monthlyBudgets.length > 0
                ? Math.round((totalSpent / monthlyBudgets[0].amount) * 100)
                : 0}%
            </span>
          </div>
        </div>

        {/* Row 5: Carousel Indicators */}
        <div className="flex items-center justify-center gap-2">
          {[0, 1, 2].map((i) => (
            <div
              key={i}
              className="h-1.5 rounded-full transition-all duration-300"
              style={{
                width: i === 0 ? '20px' : '6px',
                backgroundColor: i === 0 ? '#FFFFFF' : 'rgba(255,255,255,0.3)',
              }}
            />
          ))}
        </div>
      </div>
      ```

      ## Required Calculations (add near the top of the component, after existing hooks)
      Add these computed values:
      ```tsx
      // Hero Widget calculations
      const avgSpend = 3500; // mock average — wire to apiService in Sprint 2
      const belowAverage = Math.max(0, Math.round(avgSpend - totalSpent));
      const daysUntilPayday = 8; // mock — wire to transaction history analysis
      ```

      ## Required Imports
      Ensure these are in the import section:
      ```tsx
      import { Check, Banknote, Info } from 'lucide-react';
      ```

      ## Verification
      1. Read DashboardPage.tsx and find the existing Hero Card section
      2. Replace it entirely with the new Hero Widget code above
      3. Add `Check`, `Banknote`, `Info` imports from lucide-react if not present
      4. Add computed values for belowAverage and daysUntilPayday
      5. Run `npx tsc --noEmit` — must pass with 0 errors
      6. Report exact lines changed
    assigned_to: "frontend-dev"
    role: "produce"
    depends_on: []
    gates: []
    max_retries: 1
    timeout_ms: 600000
    hang_alert_after_ms: 600000

